<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 - 鹿功汇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#26211d,#4a3226)}
.box{background:#fff;border-radius:14px;padding:36px;width:380px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
h1{font-size:22px;text-align:center;color:#8b2e1f;letter-spacing:3px}
.slogan{text-align:center;color:#c9a45c;font-size:12px;margin:6px 0 26px;letter-spacing:2px}
label{font-size:13px;color:#8a8078;display:block;margin-bottom:4px}
input{width:100%;padding:11px 12px;border:1px solid #e6e2dc;border-radius:8px;font-size:15px;margin-bottom:14px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#8b2e1f;color:#fff;font-size:16px;cursor:pointer}
button:hover{background:#6e2418}
.errors{color:#c0392b;font-size:13px;margin-bottom:12px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>鹿功汇管理后台</h1>
  <div class="slogan">传承武学 · 修习身心</div>
  {% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors.0 }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>手机号</label>
    <input type="text" name="phone" value="{{ form.phone.value|default:'' }}" autofocus>
    <label>密码</label>
    <input type="password" name="password">
    <button type="submit">登 录</button>
  </form>
</div>
</body>
</html>
