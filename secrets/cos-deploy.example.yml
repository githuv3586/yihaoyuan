# 复制到「密钥仓库」后改名使用，例如：
#   https://cnb.cool/zhanxiaoyu/opc-so-secrets/-/blob/main/cos-deploy.yml
#
# ⚠️ 不要把真实密钥提交到 opc-so 业务仓库。

# 允许被哪些仓库 / 事件 / 分支引用（按需收紧）
allow_slugs:
  - zhanxiaoyu/opc-so
allow_events:
  - push
  - web_trigger
allow_branches:
  - main

# 腾讯云 API 密钥（需具备目标 COS 桶写权限 + CDN 刷新权限）
TENCENTCLOUD_SECRET_ID: "替换为你的 SecretId"
TENCENTCLOUD_SECRET_KEY: "替换为你的 SecretKey"

# 可选覆盖（与 .cnb.yml env 同名时，以 .cnb.yml 的 env 优先）
COS_BUCKET: "opc-site-1256908292"
COS_REGION: "ap-guangzhou"
CDN_DOMAIN: "opc.hejinhong.site"
