<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>锦鸿行 · 发现身边的活动</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="phone" class="phone">
      <!-- 顶部状态/品牌栏 -->
      <header id="appbar" class="appbar">
        <div class="appbar-inner" id="appbar-inner"></div>
      </header>

      <!-- 主内容区，按路由渲染 -->
      <main id="view" class="view"></main>

      <!-- 底部导航 -->
      <nav class="tabbar">
        <a class="tab" data-tab="home" href="#/">
          <span class="tab-ico">🏠</span><span>首页</span>
        </a>
        <a class="tab" data-tab="my" href="#/my">
          <span class="tab-ico">🎫</span><span>我的报名</span>
        </a>
      </nav>

      <!-- 报名弹窗 -->
      <div id="modal" class="modal hidden">
        <div class="modal-mask" data-close="1"></div>
        <div class="modal-card">
          <div class="modal-title">填写报名信息</div>
          <form id="signup-form">
            <label class="field">
              <span>姓名</span>
              <input name="userName" type="text" placeholder="请输入姓名" required />
            </label>
            <label class="field">
              <span>手机号</span>
              <input
                name="userPhone"
                type="tel"
                placeholder="请输入手机号"
                pattern="1[0-9]{10}"
                maxlength="11"
                required
              />
            </label>
            <label class="field">
              <span>票数</span>
              <input name="ticketCount" type="number" value="1" min="1" max="6" required />
            </label>
            <div id="signup-amount" class="signup-amount"></div>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-close="1">取消</button>
              <button type="submit" class="btn btn-primary">确认报名</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 登录弹窗（登录即自动注册，无独立注册入口） -->
      <div id="login-modal" class="modal hidden">
        <div class="modal-mask" data-lclose="1"></div>
        <div class="modal-card">
          <div class="modal-title">登录 / 一键注册</div>
          <form id="login-form">
            <label class="field">
              <span>手机号</span>
              <input
                name="phone"
                type="tel"
                placeholder="请输入手机号"
                pattern="1[0-9]{10}"
                maxlength="11"
                required
              />
            </label>
            <label class="field">
              <span>密码</span>
              <input
                name="password"
                type="password"
                placeholder="请输入密码"
                minlength="6"
                required
              />
            </label>
            <p class="login-hint">未注册的手机号，登录时将自动为你创建账号</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-lclose="1">取消</button>
              <button type="submit" class="btn btn-primary">登录</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 轻提示 -->
      <div id="toast" class="toast hidden"></div>
    </div>

    <!-- 接入真实云开发时取消下一行注释，并在 config.js 填写 ENV_ID -->
    <!-- <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.7.2/cloudbase.full.js"></script> -->
    <script src="./js/config.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
